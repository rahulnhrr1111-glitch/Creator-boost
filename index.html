<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreatorBoost</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#08080d;
  color:#fff;
}
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 6%;
  background:#101016;
  position:sticky;
  top:0;
  z-index:10;
}
.logo{font-size:27px;font-weight:800}
.logo span{color:#ff0088}
nav a{
  color:#ddd;
  text-decoration:none;
  margin-left:18px;
}
.hero{
  text-align:center;
  padding:70px 7%;
}
.hero h1{
  font-size:clamp(40px,8vw,70px);
  margin:10px 0;
}
.hero h1 span{color:#ff0088}
.hero p{color:#aaa;font-size:18px}
.btn{
  border:0;
  border-radius:14px;
  padding:15px 24px;
  background:#ff0088;
  color:white;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  margin:5px;
}
.btn.secondary{background:#252532}
section{padding:50px 7%}
h2{text-align:center;font-size:34px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
}
.card{
  background:#15151f;
  border:1px solid #292936;
  border-radius:20px;
  padding:25px;
}
.card h3{font-size:22px}
.card p{color:#aaa;line-height:1.5}
.auth{
  max-width:480px;
  margin:auto;
  background:#15151f;
  padding:30px;
  border-radius:20px;
  border:1px solid #292936;
}
input,textarea,select{
  width:100%;
  padding:14px;
  margin:8px 0 15px;
  border-radius:12px;
  border:1px solid #444;
  background:#09090e;
  color:white;
  font-size:16px;
}
textarea{min-height:120px;resize:vertical}
.hidden{display:none!important}
.msg{color:#ff4da6;margin:10px 0}
.toolbox{
  max-width:700px;
  margin:20px auto;
}
.result{
  background:#101016;
  border:1px solid #30303b;
  border-radius:16px;
  padding:20px;
  margin-top:15px;
  line-height:1.7;
}
footer{
  text-align:center;
  padding:40px;
  color:#777;
}
</style>
</head>

<body>

<nav>
  <div class="logo">Creator<span>Boost</span></div>
  <div>
    <a href="#tools">Tools</a>
    <a href="#plans">Plans</a>
    <a href="#account">Account</a>
  </div>
</nav>

<header class="hero">
  <div>CREATORBOOST PRO</div>
  <h1>Your Creator <span>Command Center</span></h1>
  <p>Generate ideas, hooks, captions and plan your content in one place.</p>
  <button class="btn" onclick="openDashboard()">Open Dashboard</button>
</header>

<section id="tools">
<h2>Quick Pro Tools</h2>

<div class="grid">

<div class="card">
<h3>🎬
